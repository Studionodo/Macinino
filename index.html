<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macinino — Calcolatore grana</title>
<meta name="description" content="Calcolatore della macinatura del caffè. Funziona offline, nessun account, nessun dato inviato.">
<meta name="author" content="Studionodo">
<meta name="copyright" content="© 2026 Studionodo — Tutti i diritti riservati">

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F0E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macinino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Fraunces solo sul numero: è l'unica cosa che deve avere una voce. */
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/fraunces.woff2') format('woff2');}

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  /* ── TEMA ──
     Segue il sistema. Il colore resta riservato al risultato: ambra = più
     fine, terracotta = più grossa. Sul chiaro le tinte sono più scure,
     perché l'ambra sul bianco non ha contrasto (2,2:1). */
  :root{
    color-scheme:light dark;
    --bg:#F3F0E9; --surface:#FFFFFF; --surface2:#ECE8DF; --thumb:#FFFFFF;
    --fg:#1D1C1A; --mid:#625F57; --line:rgba(0,0,0,.09);
    --fine:#9A5800; --medium:#A8470F; --coarse:#B03520;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(60,45,20,.07);
    --scrim:rgba(20,16,10,.38);
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',system-ui,sans-serif;
    --spring:cubic-bezier(.34,1.45,.64,1);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#111316; --surface:#1B1E23; --surface2:#262A31; --thumb:#3A3F47;
      --fg:#EEEAE2; --mid:#A5A29A; --line:rgba(255,255,255,.09);
      --fine:#E8A63F; --medium:#E08A47; --coarse:#E67A5A;
      --shadow:none;
      --scrim:rgba(0,0,0,.55);
    }
  }

  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{
    font-family:var(--sans); font-size:16px; line-height:1.4;
    background:var(--bg); color:var(--fg);
    min-height:100dvh; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
  button:disabled{cursor:default}
  :focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .app{
    max-width:520px;margin:0 auto;
    padding:max(12px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }

  /* ── INTESTAZIONE ── niente da fissare: la schermata è corta */
  .top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 14px}
  .brand{display:inline-flex;align-items:center;gap:7px;font-size:26px;font-weight:700;letter-spacing:-.03em}
  .mark .crease{stroke:var(--bg)}
  .mark ellipse{transition:fill .35s}

  .info-btn{
    flex:none;width:22px;height:22px;border-radius:50%;
    background:var(--surface2);color:var(--mid);
    font-size:12px;font-weight:600;font-family:var(--serif);font-style:italic;
    display:inline-grid;place-items:center;line-height:1;
    position:relative;
  }
  /* area di tocco da 44px senza ingrandire il disegno */
  .info-btn::after{content:"";position:absolute;inset:-11px}
  .info-btn.big{width:34px;height:34px;font-size:16px}
  .info-btn.big::after{inset:-5px}
  .info-btn.pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fg) 30%,transparent)}
    50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--fg) 0%,transparent)}
  }

  /* ── SUPERFICI ── */
  .card{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);margin-bottom:12px}

  /* Selettore del metodo */
  .pick{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px 14px 22px;min-height:64px;border-radius:24px;
    transition:transform .25s var(--spring);
  }
  .pick:active{transform:scale(.985)}
  .pick-txt{display:flex;flex-direction:column;gap:1px}
  .pick-lbl{font-size:13px;color:var(--mid)}
  .pick-val{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .chev{color:var(--mid);transition:transform .25s var(--spring);flex:none}
  .chev.up{transform:rotate(180deg)}

  /* ── RISULTATO ── */
  .hero{padding:22px 22px 20px}
  .cap-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px}
  .cap{font-size:14px;color:var(--mid)}
  .cap-actions{display:flex;gap:4px}
  .link-btn{
    font-size:14px;color:var(--mid);padding:6px 10px;margin:-6px -10px;border-radius:12px;
    text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;
  }
  .cap-actions .link-btn{margin:-6px 0;}
  .link-btn:active{background:var(--surface2)}
  .num-row{display:flex;align-items:baseline;margin:2px 0 6px}
  .hero-num{
    font-family:var(--serif);font-weight:600;font-optical-sizing:auto;
    font-size:clamp(88px,28vw,120px);line-height:1;letter-spacing:-.04em;
    font-variant-numeric:lining-nums;transition:color .35s;
  }
  .hero-sup{font-size:.28em;font-weight:400;letter-spacing:0;color:var(--mid);margin-left:.1em}
  .move{
    display:inline-block;font-size:16px;font-weight:600;padding:6px 14px;border-radius:999px;
    background:color-mix(in srgb,currentColor 11%,transparent);
    transition:color .35s,background .35s;
  }
  .notes{margin-top:10px;display:flex;flex-direction:column;gap:2px}
  .notes:empty{display:none}
  .note{font-size:14px;color:var(--mid)}
  .note::before{content:"· "}

  /* Domanda iniziale, quando il metodo non ha ancora un punto di partenza */
  .ask{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
  .ask-row{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
  .pos-input{
    width:100%;min-width:0;background:var(--surface2);color:var(--fg);border:2px solid transparent;
    border-radius:20px;padding:12px 18px;font-family:var(--serif);font-weight:600;
    font-size:44px;line-height:1.1;letter-spacing:-.03em;outline:none;
    transition:border-color .2s;
  }
  .pos-input::placeholder{font-family:var(--sans);font-weight:400;font-size:18px;letter-spacing:0;color:var(--mid)}
  .pos-input:focus{border-color:var(--fg)}
  .ask-unit{font-family:var(--serif);font-size:24px;color:var(--mid);white-space:nowrap}
  .ask-hint{margin-top:14px;font-size:14px;color:var(--mid)}
  .edit-actions{display:flex;gap:10px}
  .edit-actions .btn-primary{flex:1}

  .btn-primary,.btn-tonal{
    display:block;width:100%;min-height:52px;border-radius:999px;text-align:center;
    font-size:17px;font-weight:600;padding:14px 22px;
    transition:transform .25s var(--spring),opacity .2s;
  }
  .btn-primary{background:var(--fg);color:var(--bg)}
  .btn-tonal{background:var(--surface2);color:var(--fg);width:auto}
  .btn-primary:active,.btn-tonal:active{transform:scale(.97)}
  .btn-text{display:block;width:100%;text-align:center;color:var(--mid);font-size:15px;padding:14px;min-height:48px}

  /* ── FEEDBACK ── sempre sotto il numero */
  .fb{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  .fb-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .fb-q{font-size:17px;font-weight:600}
  .fb-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .fb-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    min-height:64px;padding:10px 6px;border-radius:20px;text-align:center;
    background:var(--surface2);transition:transform .25s var(--spring),background .2s;
  }
  .fb-btn:active{transform:scale(.95)}
  .fb-name{font-size:17px;font-weight:600}
  .fb-hint{font-size:12px;color:color-mix(in srgb,var(--fg) 78%,var(--bg))}
  .fb-sour{background:color-mix(in srgb,var(--fine) 14%,var(--surface2))}
  .fb-bitter{background:color-mix(in srgb,var(--coarse) 14%,var(--surface2))}
  .fb-btn.flash{animation:flash .5s var(--spring)}
  @keyframes flash{0%{transform:scale(.93)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
  .diag{margin-top:12px;font-size:14px;color:var(--mid)}
  .learned{margin-top:14px;font-size:13px;color:var(--mid)}

  /* ── SEZIONI RICHIUDIBILI ── */
  .grp{padding:0;overflow:hidden}
  .grp-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 20px 18px 22px;min-height:60px;cursor:pointer;
  }
  .grp-title{font-size:17px;font-weight:600}
  .grp-tail{display:flex;align-items:center;gap:8px;min-width:0}
  .grp-sum{font-size:14px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp-body{padding:2px 22px 22px}
  .sub{margin-top:22px}
  .sub:first-child{margin-top:6px}
  .sub h3{font-size:13px;font-weight:600;color:var(--mid);margin-bottom:12px}
  .field{margin-bottom:20px}
  .field:last-child{margin-bottom:0}
  .lbl-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .lbl{font-size:15px;font-weight:500}

  /* Controllo segmentato, alla iOS: un cursore chiaro sul fondo tonale */
  .seg{display:flex;gap:2px;padding:3px;background:var(--surface2);border-radius:16px}
  .seg-btn{
    flex:1;min-height:42px;padding:8px 6px;border-radius:13px;text-align:center;
    font-size:15px;color:var(--mid);transition:background .25s,color .25s,box-shadow .25s;
  }
  .seg-btn[aria-pressed="true"]{
    background:var(--thumb);color:var(--fg);font-weight:600;
    box-shadow:0 1px 3px rgba(0,0,0,.14);
  }
  .seg-note{margin-top:8px;font-size:13px;color:var(--mid)}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{
    display:flex;flex-direction:column;gap:1px;padding:10px 14px;min-height:56px;
    border-radius:18px;background:var(--surface2);font-size:15px;
    border:2px solid transparent;transition:border-color .2s;
  }
  .opt .ppm{font-size:12px;color:var(--mid)}
  .opt[aria-pressed="true"]{border-color:var(--fg);font-weight:600}

  /* Contatore */
  .stp-top{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
  .stp-num{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:1ch}
  .stp-num.off{color:var(--mid)}
  .stp-unit{font-size:15px;color:var(--mid)}
  .stp-hint{margin-left:auto;font-size:13px;color:var(--mid);text-align:right}
  .stp-row{display:flex;align-items:center;gap:6px}
  .stp-btn{
    flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface2);
    font-size:22px;line-height:1;display:grid;place-items:center;text-align:center;
    transition:transform .2s var(--spring),opacity .2s;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  .stp-btn:active:not(:disabled){transform:scale(.9)}
  .stp-btn:disabled{opacity:.3}
  .stp-hit{flex:1;height:44px;display:flex;align-items:center;cursor:pointer}
  .stp-track{position:relative;width:100%;height:6px;border-radius:3px;background:var(--surface2)}
  .stp[data-off] .stp-hit{cursor:default;opacity:.5}
  .stp-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--fg);opacity:.85;transition:width .12s}
  .stp-knob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    background:var(--fg);box-shadow:0 0 0 4px var(--surface);transition:left .12s}
  .stp-band{position:absolute;top:-3px;bottom:-3px;border-radius:5px;
    background:color-mix(in srgb,var(--fg) 16%,transparent)}
  .stp .link-btn{display:inline-block;margin-top:10px}
  .shot-diag{font-size:14px;color:var(--mid);margin-top:4px}

  /* ── FOGLI DAL BASSO ── */
  .veil{
    position:fixed;inset:0;z-index:20;background:var(--scrim);
    display:flex;align-items:flex-end;justify-content:center;
    animation:fade .22s ease-out;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    width:100%;max-width:520px;max-height:86dvh;display:flex;flex-direction:column;
    background:var(--surface);border-radius:32px 32px 0 0;
    padding-bottom:env(safe-area-inset-bottom);
    animation:rise .42s var(--spring);box-shadow:0 -8px 40px rgba(0,0,0,.18);
  }
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 2px;
    background:color-mix(in srgb,var(--fg) 22%,transparent)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 8px 24px}
  .sheet-titles{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .sheet-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .impact{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--mid)}
  .sheet-x{width:44px;height:44px;border-radius:50%;background:var(--surface2);font-size:24px;line-height:1;
    display:grid;place-items:center;text-align:center;flex:none}
  .sheet-scroll{overflow-y:auto;overscroll-behavior:contain;padding:4px 24px 28px;-webkit-overflow-scrolling:touch}
  .info-body{font-size:16px;line-height:1.55}
  .info-body em,.info-src em{font-style:normal;font-weight:600}
  .info-src{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;line-height:1.55;color:var(--mid)}
  .info-src b{color:var(--fg);font-weight:600}

  .mlist{display:flex;flex-direction:column}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:56px;padding:8px 8px;border-bottom:1px solid var(--line);font-size:18px}
  .mrow:last-child{border-bottom:0}
  .mrow:active{background:var(--surface2)}
  .mrow[aria-pressed="true"] .mname{font-weight:700}
  .mtail{display:flex;align-items:center;gap:10px}
  .msaved{font-size:13px;color:var(--mid)}
  .tick{opacity:0}
  .tick.on{opacity:1}

  /* ── PRIMO AVVIO ── */
  .onb{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;animation:fade .25s ease-out}
  .onb-wrap{
    max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:max(14px,env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  }
  .onb-top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 10px}
  .onb-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:12px 0 24px}
  .onb-title{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
  .onb-body{font-size:17px;color:var(--mid);line-height:1.5}
  .onb-list{list-style:none;display:flex;flex-direction:column;gap:12px;margin:4px 0 8px}
  .onb-list li{background:var(--surface);border-radius:20px;padding:14px 18px;font-size:15px;color:var(--mid);line-height:1.45;box-shadow:var(--shadow)}
  .onb-list b{color:var(--fg);font-weight:600}
  .onb-input{
    width:100%;background:var(--surface);color:var(--fg);border:2px solid transparent;border-radius:22px;
    padding:14px 20px;font-family:var(--serif);font-weight:600;font-size:40px;letter-spacing:-.03em;outline:none;
    box-shadow:var(--shadow);
  }
  .onb-input::placeholder{font-family:var(--sans);font-weight:400;font-size:18px;color:var(--mid);letter-spacing:0}
  .onb-input:focus{border-color:var(--fg)}
  .onb-foot{display:flex;flex-direction:column;align-items:center;gap:4px}
  .onb-dots{display:flex;gap:8px;padding:6px 0}
  .onb-dots span{width:8px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--fg) 22%,transparent);transition:width .3s var(--spring),background .3s}
  .onb-dots .on{width:24px;background:var(--fg)}

  /* ── PIÈ DI PAGINA ── */
  .foot{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .foot-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .lang-pill{display:inline-flex;padding:3px;gap:2px;background:var(--surface2);border-radius:999px}
  .lang-btn{min-width:44px;min-height:40px;padding:6px 10px;border-radius:999px;text-align:center;font-size:13px;font-weight:600;color:var(--mid);transition:background .25s,color .25s}
  .lang-btn[aria-pressed="true"]{background:var(--thumb);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .kofi{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:999px;
    background:var(--surface);color:var(--fg);font-size:14px;font-weight:600;text-decoration:none;box-shadow:var(--shadow)}
  .kofi-steam{opacity:.6}
  .foot-claim{font-size:13px;color:var(--mid)}
  .foot-note{font-size:12px;color:var(--mid)}
  .foot-copy{font-size:12px;color:var(--mid)}
  .foot-link{color:inherit;text-underline-offset:3px}

  /* ── INSTALLAZIONE ── */
  .install-bar{
    position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;
    max-width:496px;margin:0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 12px 12px 18px;border-radius:24px;background:var(--fg);color:var(--bg);
    box-shadow:0 8px 28px rgba(0,0,0,.25);animation:rise .45s var(--spring);
  }
  .install-txt{flex:1;font-size:14px;line-height:1.35}
  .install-go{padding:10px 18px;border-radius:999px;background:var(--bg);color:var(--fg);font-weight:600;font-size:15px;min-height:44px}
  .install-x{width:44px;height:44px;font-size:22px;line-height:1;text-align:center;opacity:.7}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div id="root" class="app"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
